<style>
  /* Remove the theme padding so the portrait spans the full sidebar width. */
  .sidebar {
    padding: 0 !important; /* Overrides the padding defined by the Hyde theme. */
    overflow: hidden; /* Clips the portrait to any sidebar border radius. */
  }

  .sidebar-inner {
    padding: 0 !important;
  }

  .sidebar .sidebar-photo {
    display: block;
    width: 100%;
    height: auto;
    max-height: none;
    object-fit: contain; /* Keeps the complete portrait visible in stacked layouts. */
    object-position: center top;
    transform: translateY(0%); /* Overrides the base theme's upward offset. */
  }

  /* Keep the whole portrait on phones, but small enough to leave room for the page. */
  @media (max-width: 520px) {
    .sidebar .sidebar-photo {
      width: auto;
      max-width: 100%;
      height: min(40vh, 320px);
      margin: 0 auto;
    }
  }

  /* Cap the portrait between phone and desktop layouts without cropping it. */
  @media (min-width: 521px) and (max-width: 64.999em) {
    .sidebar .sidebar-photo {
      width: auto;
      max-width: 100%;
      height: min(55vh, 520px);
      margin: 0 auto;
    }
  }

  .sidebar-about {
    display: flow-root; /* Prevents the heading margin from collapsing upward. */
    padding: 14px 20px 14px !important; /* Same green margin below the menu as above the name. */
    border-top: 1px solid transparent; /* Preserves the gap below the portrait. */
  }

  .sidebar-about h1 {
    margin-top: 0 !important;
  }

  .sidebar-about > br:last-child {
    display: none; /* Drops the empty line under the menu. */
  }

  /* Keep the title and affiliation on one line in stacked layouts; the break
     is only shown when the sidebar sits beside the content. */
  .desktop-break {
    display: none;
  }

  .sidebar-about .lead {
    margin-bottom: .35rem; /* Keeps the profile icons close to the email line. */
  }

  .sidebar-about .lead-email {
    display: block;
  }

  /* Profile links (Google Scholar, CV) under the contact details. */
  .sidebar-links {
    display: flex;
    justify-content: center; /* Matches the centred mobile sidebar. */
    gap: .9rem;
    margin: 0 0 .3rem;
    font-size: 1.35rem;
    line-height: 1;
  }

  .sidebar .sidebar-links a,
  .sidebar .theme-toggle {
    color: #fff;
  }

  .sidebar .sidebar-links a:hover,
  .sidebar .sidebar-links a:focus,
  .sidebar .theme-toggle:hover,
  .sidebar .theme-toggle:focus {
    color: #CFE3D4;
    filter: none;
  }

  .sidebar-links .ai {
    font-size: 1.1em; /* The Academicons glyph is lighter than the Font Awesome ones. */
  }

  .sidebar .theme-toggle {
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    line-height: 1;
    cursor: pointer;
  }

  /* Labels shown when hovering the icons. Anchored at the icon's right edge so they
     grow leftwards and never get cut off by the sidebar's right edge. */
  .sidebar [data-tooltip] {
    position: relative;
  }

  .sidebar [data-tooltip]::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 6px);
    right: 0;
    z-index: 10;
    padding: 3px 8px;
    border-radius: 4px;
    background: #F3F7F4;
    color: #1F3A2E;
    font-family: 'CH_semibold';
    font-size: 0.75rem;
    line-height: 1.3;
    white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
    opacity: 0;
    pointer-events: none;
    transition: opacity .12s ease;
  }

  .sidebar [data-tooltip]:hover::after,
  .sidebar [data-tooltip]:focus-visible::after {
    opacity: 1;
  }

  @media (min-width: 65em) {
    .sidebar-links {
      justify-content: flex-end;
    }

    .desktop-break {
      display: inline;
    }
  }

  /* Keep the portrait and bio in separate rows on desktop. */
  @media (min-width: 65em) {
    :root {
      --sidebar-width: clamp(14rem, calc(100vh - 300px), 16rem);
    }

    .sidebar {
      width: var(--sidebar-width);
      overflow-x: hidden;
      overflow-y: auto;
    }

    .sidebar-inner {
      display: grid;
      grid-template-rows: minmax(0, max-content) auto; /* The portrait shrinks only on short screens. */
      align-content: start; /* Name sits right under the portrait; spare space goes to the bottom. */
      row-gap: clamp(5px, 1vh, 8px); /* Guarantees a small green buffer below the portrait. */
      height: 100%;
    }

    .sidebar .sidebar-photo {
      width: 100%;
      height: min(520px, clamp(55vh, calc(40vh + 140px), 65vh));
      max-height: 100%;
      margin: 0;
      object-fit: cover;
    }

    .sidebar-about {
      position: static;
      width: 100%;
      box-sizing: border-box;
      padding: clamp(8px, 2vh, 14px) 20px min(1.5rem, 2.667vh) !important;
      font-size: clamp(0.875rem, 2.3vh, 1rem);
    }

    .sidebar-about h1 {
      font-size: clamp(1.43rem, 4.6vh, 2.02rem) !important;
      margin-bottom: .675rem !important; /* Overrides the inline 1px used on phones. */
    }

    .sidebar-about .lead {
      margin-bottom: 1.05rem; /* Space between the email line and the profile icons. */
      font-size: clamp(0.8rem, 2.1vh, 0.9rem) !important;
    }

    .sidebar-about .lead-email {
      margin-top: .55rem; /* Separates the email from the affiliation. */
    }

    .sidebar-about > span {
      height: 0.95em !important; /* Space between the profile icons and the menu. */
    }


    .content {
      margin-left: calc(var(--sidebar-width) + 6rem);
    }
  }

</style>

<div class="sidebar">
  <div class="sidebar-inner">
    <img src="/photos/N22-1508.jpg" class="sidebar-photo" alt="Portrait of Ricard Grebol">
    <div class="sidebar-about">
      <a href="{{ '/' | relative_url }}" style="color: white;">
        <h1 style="color: white; font-size: 2.02rem; margin-bottom: 1px;">RICARD GREBOL</h1>
      </a>
      <p class="lead" style="font-size: 0.9rem">
        PhD candidate in Economics, <br class="desktop-break"><a href="https://www.uu.se/institution/nationalekonomiska/" target="_blank">Uppsala University</a>
        <span class="lead-email"><a href="mailto:ricard.grebol@nek.uu.se"><span class="has-tooltip" data-tooltip="Email"><i class="fa-solid fa-envelope" aria-hidden="true"></i></span>&nbsp;ricard.grebol@nek.uu.se</a></span>
      </p>

      <!-- Profile links -->
      <div class="sidebar-links">
        <a href="https://scholar.google.com/citations?user=nQ7fnTEAAAAJ&amp;hl=en" target="_blank" rel="noopener noreferrer" data-tooltip="Google Scholar" aria-label="Google Scholar">
          <i class="ai ai-google-scholar" aria-hidden="true"></i>
        </a>
        <a href="{{ '/resume/CV_RicardGrebol.pdf' | relative_url }}" target="_blank" rel="noopener noreferrer" data-tooltip="CV" aria-label="CV">
          <i class="fa-solid fa-file-lines" aria-hidden="true"></i>
        </a>
        <button type="button" class="theme-toggle" data-tooltip="Dark mode" aria-label="Switch to dark mode">
          <i class="fa-solid fa-moon" aria-hidden="true"></i>
        </button>
      </div>

      <!-- Light/dark toggle; the initial mode is set in head.html. -->
      <script>
        (function () {
          var root = document.documentElement;
          var button = document.querySelector('.theme-toggle');
          var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

          function render() {
            var dark = root.getAttribute('data-theme') === 'dark';
            button.setAttribute('data-tooltip', dark ? 'Light mode' : 'Dark mode');
            button.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
            button.querySelector('i').className = dark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
          }

          button.addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            render();
          });

          // Follow system changes until the visitor picks a mode themselves.
          if (media && media.addEventListener) {
            media.addEventListener('change', function (event) {
              var saved = null;
              try { saved = localStorage.getItem('theme'); } catch (e) {}
              if (!saved) {
                root.setAttribute('data-theme', event.matches ? 'dark' : 'light');
                render();
              }
            });
          }

          render();
        })();
      </script>

      <!-- Section navigation -->
      <span style="display: block; height: 0.5em;"></span>
      <a href="#about">About</a>
      <br>
      <a href="#working-papers">Research</a>
      <br>
      <a href="#teaching">Teaching</a>
      <br>
      <br>
    </div>
  </div>
</div>
